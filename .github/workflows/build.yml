name: Build and verify UN Peacekeepers
on:
  push:
    branches: [main, release/0.3.0-alpha, release/0.3.1-alpha, release/0.3.2-alpha, release/0.3.3-alpha]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate definitions and translations
        run: python3 tools/verify_content.py
      - name: Test goodwill, mission, pollution and reward boundaries
        run: dotnet run --project tests/RulesTests.csproj -c Release
      - name: Compile RimWorld 1.6 DLL
        run: dotnet build UNPeacekeepers/Source/UNPeacekeepers.csproj -c Release
      - name: Verify original assets and package complete mod
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: UN-Peacekeepers-${{ github.ref_name == 'release/0.3.3-alpha' && 'v0.3.3-alpha-development' || 'v0.3.2-alpha-complete' }}
          path: |
            UN_Peacekeepers_v0.3.2-alpha.zip
            UN_Peacekeepers_v0.3.2-alpha.zip.sha256
          if-no-files-found: error
