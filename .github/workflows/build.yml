name: Build and verify UN Peacekeepers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test goodwill boundaries and assessment rules
        run: dotnet run --project tests/RulesTests.csproj -c Release
      - name: Compile RimWorld 1.6 DLL
        run: dotnet build UNPeacekeepers/Source/UNPeacekeepers.csproj -c Release
      - name: Verify original assets and package complete mod
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: UN-Peacekeepers-v0.2.7-complete
          path: |
            UN_Peacekeepers_v0.2.7.zip
            UN_Peacekeepers_v0.2.7.zip.sha256
          if-no-files-found: error
