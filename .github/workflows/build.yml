name: Build UN authorization DLL
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build UNPeacekeepers/Source/UNPeacekeepers.csproj -c Release
      - run: rm -rf UNPeacekeepers/Source/obj UNPeacekeepers/Source/bin && zip -qr UN-source-and-dll.zip UNPeacekeepers
      - uses: actions/upload-artifact@v4
        with:
          name: UN-source-and-dll
          path: UN-source-and-dll.zip
          if-no-files-found: error
